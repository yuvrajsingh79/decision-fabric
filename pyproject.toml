[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-fabric"
version = "0.1.0"
description = "A knowledge graph that decides which Claude model and config a query actually needs"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "pyyaml>=6.0", "anthropic>=0.40.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
decision-fabric = "decision_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
