# Budget policies -> Policy nodes. A tenant/workload picks one.
#
# Two different bars, deliberately separate:
#   quality_floor    - model SELECTION. How much capability headroom must a
#                      model have before this policy will route to it at all.
#   accept_threshold - answer ACCEPTANCE. Is the response that came back good
#                      enough to return to the user.
# Setting them equal makes any model sitting near the floor a coin flip, and
# the learning loop then drives it out of the candidate pool for good --
# measured as a cost regression from +28% to -26% over five rounds. The
# acceptance bar is an absolute shippability test and sits below the floor.

policies:

  economy:
    desc: "Bulk internal workloads. Cheapest model that clears a modest bar."
    quality_floor: 0.60          # min expected_quality to route here at all
    accept_threshold: 0.45       # min realised quality to ship the answer
    cascade: true                # try cheap, verify, escalate on failure
    max_escalations: 2
    allow_batch: true
    allow_fast_mode: false
    effort_bias: -1              # shift effort one notch down
    verifier: heuristic

  balanced:
    desc: "Default for internal knowledge work."
    quality_floor: 0.72
    accept_threshold: 0.55
    cascade: true
    max_escalations: 1
    allow_batch: true
    allow_fast_mode: false
    effort_bias: 0
    verifier: heuristic

  quality:
    desc: "Customer-facing output. Cascade only from one rung down."
    quality_floor: 0.85
    accept_threshold: 0.68
    cascade: true
    max_escalations: 1
    allow_batch: false
    allow_fast_mode: true
    effort_bias: 0
    verifier: llm                # cheap Haiku judge before accepting

  critical:
    desc: "Regulated / irreversible. No cascade, no batch, top of the ladder."
    quality_floor: 0.93
    accept_threshold: 0.80
    cascade: false
    max_escalations: 0
    allow_batch: false
    allow_fast_mode: true
    effort_bias: +1
    verifier: llm

default_policy: balanced

# Domains that force a minimum policy regardless of what the caller asked for.
policy_floors_by_domain:
  healthcare: quality
  legal: quality
  finance: quality

# The learning loop.
learning:
  # Beta prior strength: how many observations before evidence outweighs the
  # hand-authored seed prior. Lower = adapts faster, noisier.
  prior_strength: 8
  # Cap how far evidence may move a capability level away from its seed.
  max_level_drift: 0.10
  # An escalation is recorded as a failure for the model that was escalated from.
  escalation_counts_as_failure: true
  # Std-dev of realised answer quality around a model's expected quality. Used
  # to turn "expected quality vs acceptance bar" into a probability of failure
  # for the cascade EV gate. In production, estimate this from your own
  # verifier scores rather than trusting this default.
  quality_sigma: 0.10

  # Evidence borrowing across related task types.
  #
  # A model with no observations on `debugging` but ten on `code_review` is not
  # a blank slate: the two tasks demand overlapping capabilities. SIMILAR_TO
  # edges are derived at boot from that overlap, and a task with thin evidence
  # borrows from its neighbours, discounted by similarity.
  similarity:
    min_similarity: 0.35      # below this, tasks are treated as unrelated
    borrow_discount: 0.70     # borrowed observations count for less than direct ones
    max_borrowed_weight: 4.0  # ceiling on borrowed evidence, in observation-equivalents

  # Task definitions learn too, not only models.
  #
  # Every REQUIRES min_level is a hand-authored guess. The router has direct
  # evidence about them: when the model it selected only just cleared a bar and
  # then failed verification, that bar was too low.
  #
  # The two directions are NOT symmetric, on purpose. Raising is well-evidenced
  # -- a thin margin plus a failure is a specific, attributable event. Lowering
  # is not: a model succeeding with headroom does not demonstrate that less
  # would have sufficed. So raising is fast and lowering is slow, and the
  # failure mode of being wrong is over-provisioning, which costs money rather
  # than quality.
  requirements:
    enabled: true
    thin_margin: 0.08        # margin below which a model "only just" cleared the bar
    generous_margin: 0.25    # margin above which success is evidence of slack
    raise_rate: 0.40         # fraction of the observed shortfall applied per update
    lower_rate: 0.05         # deliberately an order of magnitude slower
    min_observations: 4      # per (task, capability) before any adjustment
    max_drift: 0.12          # bound either side of the authored level

# Cheap models used by the fabric itself. These are infrastructure calls, not
# routed user work — keep them at the bottom of the ladder or the router costs
# more than it saves.
meta_models:
  classifier: claude-haiku-4-5
  verifier: claude-haiku-4-5

# ---------------------------------------------------------------- classification
#
# Measured on held-out data, the free regex layer classifies natural enterprise
# phrasing at ~14% accuracy: 11 of 16 task types score zero recall. It is not a
# classifier and must not be used as one. It is a PRECISION fast-path -- it may
# skip the paid LLM call only where it has demonstrated it is reliable.
#
# So the gate is no longer a hand-picked confidence number. The heuristic may
# commit only if its confidence band has MEASURED precision >= min_commit_precision
# on the development set. Bands with no measurement, or insufficient support,
# always escalate. Regenerate with:  python eval/calibrate.py
#
# This costs more LLM calls and is worth it: at $0.00072 a call, classification
# overhead is ~1.6% of the average per-query routing saving. Misrouting is the
# expensive failure, not classifying.
classification:
  min_commit_precision: 0.90   # required measured precision to skip the LLM
  min_band_support: 5          # min observations before a band may be trusted
  calibration_file: calibration.yaml

  # When the gate says "do not trust the heuristic" but no LLM classification
  # actually happened -- no credentials, classifier errored, refinement disabled
  # -- the task type is a guess the system has ALREADY declared unreliable.
  # Routing cheaply on it is exactly how a cost optimiser silently degrades
  # answers while reporting a saving. Treat it as uncertainty, not as fact.
  unverified_classification:
    disable_cascade: true       # do not compound a guess with a cheap probe
    quality_floor_premium: 0.08 # demand more headroom to absorb a wrong task type
